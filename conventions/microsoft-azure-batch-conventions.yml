rate_limit_signaling:
  headers_documented: false
  detail: >-
    No RateLimit-* or Retry-After headers are documented for the Batch data plane.
    Overload surfaces as ServerBusy (503) and OperationTimedOut (500); quota exhaustion
    surfaces as a named error code, not a 429. See
    rate-limits/microsoft-azure-batch-rate-limits.yml.
events:
  webhooks: false
  asyncapi: false
  detail: >-
    Azure Batch publishes no webhook or push-event surface and is not a Microsoft.Batch
    source in Azure Event Grid system topics (checked 2026-09-17). Job, task and pool state
    changes are observed by polling the resource, or by routing Batch service logs and
    metrics to Log Analytics / Event Hubs / Storage through an Azure Monitor diagnostic
    setting. That is a telemetry pipeline, not an API event contract, so no AsyncAPI
    document is asserted here.
