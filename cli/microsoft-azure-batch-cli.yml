source: https://learn.microsoft.com/en-us/cli/azure/batch
name: Azure CLI — az batch
official: true
vendor: Microsoft
description: 'The Batch command group of the Azure CLI. It is the only first-party CLI for Azure Batch
  and it spans BOTH planes: az batch account / application / location / private-endpoint-connection call
  the management plane (management.azure.com), while az batch job / job-schedule / task / pool / node
  call the data plane, after az batch account login establishes the account context.'
install:
- method: winget
  command: winget install --exact --id Microsoft.AzureCLI
- method: homebrew
  command: brew install azure-cli
- method: apt
  command: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
- method: docker
  command: docker run -it mcr.microsoft.com/azure-cli
- method: pip
  command: pip install azure-cli
  note: Not the recommended path; Microsoft ships platform installers.
install_docs: https://learn.microsoft.com/en-us/cli/azure/install-azure-cli
auth:
  command: az batch account login
  description: Log in to a Batch account through Microsoft Entra ID or shared-key authentication.
  note: az login establishes the Azure identity first; az batch account login then binds the Batch account
    context the data-plane commands use.
