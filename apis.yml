description: 'Azure Batch is Microsoft’s managed job-scheduling and cluster-management service for large-scale
  parallel and high-performance computing workloads. You describe pools of virtual machines, jobs and
  tasks through a REST API; Batch allocates the compute, schedules the work across it, retries failures,
  and scales the pool up and down against a formula you supply. Microsoft publishes two machine-readable
  contracts for it in the open azure-rest-api-specs repository: a 72-operation data plane per Batch account,
  and a 42-operation Azure Resource Manager control plane for the accounts themselves. There is no charge
  for Batch; you pay for the virtual machines, storage and networking the pools consume, with Spot VMs
  as the discount lever. Authentication is Microsoft Entra ID OAuth 2.0 (or a legacy shared key), and
  effective permission comes from Azure RBAC rather than from OAuth scopes.'
