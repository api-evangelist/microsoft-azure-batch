      x-ms-client-name: apiVersion
      schema:
        type: string
        minLength: 1
  securitySchemes:
    OAuth2Auth:
      type: oauth2
      flows:
        implicit:
          scopes:
            https://batch.core.windows.net//.default: ''
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
