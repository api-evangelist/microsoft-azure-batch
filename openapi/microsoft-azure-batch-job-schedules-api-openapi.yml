    BatchJobReleaseTaskUpdate:
      type: object
      description: 'A Job Release Task to run on Job completion on any Compute Node where the Job has run.

        The Job Release Task runs when the Job ends, because of one of the following:

        The user calls the Terminate Job API, or the Delete Job API while the Job is

        still active, the Job''s maximum wall clock time constraint is reached, and the

        Job is still active, or the Job''s Job Manager Task completed, and the Job is

        configured to terminate when the Job Manager completes. The Job Release Task

        runs on each Node where Tasks of the Job have run and the Job Preparation Task

        ran and completed. If you reimage a Node after it has run the Job Preparation

        Task, and the Job ends without any further Tasks of the Job running on that

        Node (and hence the Job Preparation Task does not re-run), then the Job Release

        Task does not run on that Compute Node. If a Node reboots while the Job Release

        Task is still running, the Job Release Task runs again when the Compute Node

        starts up. The Job is not marked as complete until all Job Release Tasks have

        completed. The Job Release Task runs in the background. It does not occupy a

        scheduling slot; that is, it does not count towards the taskSlotsPerNode limit

        specified on the Pool.'
      properties:
        id:
          type: string
          description: A string that uniquely identifies the Job Release Task within the Job. The ID can contain any combination of alphanumeric characters including hyphens and underscores and cannot contain more than 64 characters. If you do not specify this property, the Batch service assigns a default value of 'jobrelease'. No other Task in the Job can have the same ID as the Job Release Task. If you try to submit a Task with the same id, the Batch service rejects the request with error code TaskIdSameAsJobReleaseTask; if you are calling the REST API directly, the HTTP status code is 409 (Conflict).
        commandLine:
          type: string
          description: The command line of the Job Release Task. The command line does not run under a shell, and therefore cannot take advantage of shell features such as environment variable expansion. If you want to take advantage of such features, you should invoke the shell in the command line, for example using "cmd /c MyCommand" in Windows or "/bin/sh -c MyCommand" in Linux. If the command line refers to file paths, it should use a relative path (relative to the Task working directory), or use the Batch provided environment variable (https://learn.microsoft.com/azure/batch/batch-compute-node-environment-variables).
        containerSettings:
          $ref: '#/components/schemas/BatchTaskContainerSettingsUpdate'
          description: The settings for the container under which the Job Release Task runs. When this is specified, all directories recursively below the AZ_BATCH_NODE_ROOT_DIR (the root of Azure Batch directories on the node) are mapped into the container, all Task environment variables are mapped into the container, and the Task command line is executed in the container. Files produced in the container outside of AZ_BATCH_NODE_ROOT_DIR might not be reflected to the host disk, meaning that Batch file APIs will not be able to access those files.
        resourceFiles:
          type: array
          description: A list of files that the Batch service will download to the Compute Node before running the command line.  There is a maximum size for the list of resource files.  When the max size is exceeded, the request will fail and the response error code will be RequestEntityTooLarge. If this occurs, the collection of ResourceFiles must be reduced in size. This can be achieved using .zip files, Application Packages, or Docker Containers. Files listed under this element are located in the Task's working directory.
          items:
            $ref: '#/components/schemas/ResourceFile'
        environmentSettings:
          type: array
          description: A list of environment variable settings for the Job Release Task.
          items:
            $ref: '#/components/schemas/EnvironmentSetting'
        maxWallClockTime:
          type: string
          format: duration
          description: The maximum elapsed time that the Job Release Task may run on a given Compute Node, measured from the time the Task starts. If the Task does not complete within the time limit, the Batch service terminates it. The default value is 15 minutes. You may not specify a timeout longer than 15 minutes. If you do, the Batch service rejects it with an error; if you are calling the REST API directly, the HTTP status code is 400 (Bad Request). The time duration is specified in ISO 8601 format.
        retentionTime:
          type: string
          format: duration
          description: The minimum time to retain the Task directory for the Job Release Task on the Compute Node. After this time, the Batch service may delete the Task directory and all its contents. The default is 7 days, i.e. the Task directory will be retained for 7 days unless the Compute Node is removed or the Job is deleted. The time duration is specified in ISO 8601 format.
        userIdentity:
          $ref: '#/components/schemas/UserIdentity'
          description: The user identity under which the Job Release Task runs. If omitted, the Task runs as a non-administrative user unique to the Task.
    BatchJobPreparationTaskUpdate:
      type: object
      description: 'A Job Preparation Task to run before any Tasks of the Job on any given Compute Node.

        You can use Job Preparation to prepare a Node to run Tasks for the Job.

        Activities commonly performed in Job Preparation include: Downloading common

        resource files used by all the Tasks in the Job. The Job Preparation Task can

        download these common resource files to the shared location on the Node.

        (AZ_BATCH_NODE_ROOT_DIR\shared), or starting a local service on the Node so

        that all Tasks of that Job can communicate with it. If the Job Preparation Task

        fails (that is, exhausts its retry count before exiting with exit code 0),

        Batch will not run Tasks of this Job on the Node. The Compute Node remains

        ineligible to run Tasks of this Job until it is reimaged. The Compute Node

        remains active and can be used for other Jobs. The Job Preparation Task can run

        multiple times on the same Node. Therefore, you should write the Job

        Preparation Task to handle re-execution. If the Node is rebooted, the Job

        Preparation Task is run again on the Compute Node before scheduling any other

        Task of the Job, if rerunOnNodeRebootAfterSuccess is true or if the Job

        Preparation Task did not previously complete. If the Node is reimaged, the Job

        Preparation Task is run again before scheduling any Task of the Job. Batch will

        retry Tasks when a recovery operation is triggered on a Node. Examples of

        recovery operations include (but are not limited to) when an unhealthy Node is

        rebooted or a Compute Node disappeared due to host failure. Retries due to

        recovery operations are independent of and are not counted against the

        maxTaskRetryCount. Even if the maxTaskRetryCount is 0, an internal retry due to

        a recovery operation may occur. Because of this, all Tasks should be

        idempotent. This means Tasks need to tolerate being interrupted and restarted

        without causing any corruption or duplicate data. The best practice for long

        running Tasks is to use some form of checkpointing.'
      properties:
        id:
          type: string
          description: A string that uniquely identifies the Job Preparation Task within the Job. The ID can contain any combination of alphanumeric characters including hyphens and underscores and cannot contain more than 64 characters. If you do not specify this property, the Batch service assigns a default value of 'jobpreparation'. No other Task in the Job can have the same ID as the Job Preparation Task. If you try to submit a Task with the same id, the Batch service rejects the request with error code TaskIdSameAsJobPreparationTask; if you are calling the REST API directly, the HTTP status code is 409 (Conflict).
        commandLine:
          type: string
          description: The command line of the Job Preparation Task. The command line does not run under a shell, and therefore cannot take advantage of shell features such as environment variable expansion. If you want to take advantage of such features, you should invoke the shell in the command line, for example using "cmd /c MyCommand" in Windows or "/bin/sh -c MyCommand" in Linux. If the command line refers to file paths, it should use a relative path (relative to the Task working directory), or use the Batch provided environment variable (https://learn.microsoft.com/azure/batch/batch-compute-node-environment-variables).
        containerSettings:
          $ref: '#/components/schemas/BatchTaskContainerSettingsUpdate'
          description: The settings for the container under which the Job Preparation Task runs. When this is specified, all directories recursively below the AZ_BATCH_NODE_ROOT_DIR (the root of Azure Batch directories on the node) are mapped into the container, all Task environment variables are mapped into the container, and the Task command line is executed in the container. Files produced in the container outside of AZ_BATCH_NODE_ROOT_DIR might not be reflected to the host disk, meaning that Batch file APIs will not be able to access those files.
        resourceFiles:
          type: array
          description: A list of files that the Batch service will download to the Compute Node before running the command line. Files listed under this element are located in the Task's working directory.  There is a maximum size for the list of resource files.  When the max size is exceeded, the request will fail and the response error code will be RequestEntityTooLarge. If this occurs, the collection of ResourceFiles must be reduced in size. This can be achieved using .zip files, Application Packages, or Docker Containers.
          items:
            $ref: '#/components/schemas/ResourceFile'
        environmentSettings:
          type: array
          description: A list of environment variable settings for the Job Preparation Task.
          items:
            $ref: '#/components/schemas/EnvironmentSetting'
        constraints:
          $ref: '#/components/schemas/BatchTaskConstraints'
          description: Constraints that apply to the Job Preparation Task.
        waitForSuccess:
          type: boolean
          description: Whether the Batch service should wait for the Job Preparation Task to complete successfully before scheduling any other Tasks of the Job on the Compute Node. A Job Preparation Task has completed successfully if it exits with exit code 0. If true and the Job Preparation Task fails on a Node, the Batch service retries the Job Preparation Task up to its maximum retry count (as specified in the constraints element). If the Task has still not completed successfully after all retries, then the Batch service will not schedule Tasks of the Job to the Node. The Node remains active and eligible to run Tasks of other Jobs. If false, the Batch service will not wait for the Job Preparation Task to complete. In this case, other Tasks of the Job can start executing on the Compute Node while the Job Preparation Task is still running; and even if the Job Preparation Task fails, new Tasks will continue to be scheduled on the Compute Node. The default value is true.
        userIdentity:
          $ref: '#/components/schemas/UserIdentity'
          description: The user identity under which the Job Preparation Task runs. If omitted, the Task runs as a non-administrative user unique to the Task on Windows Compute Nodes, or a non-administrative user unique to the Pool on Linux Compute Nodes.
        rerunOnNodeRebootAfterSuccess:
          type: boolean
          description: Whether the Batch service should rerun the Job Preparation Task after a Compute Node reboots. The Job Preparation Task is always rerun if a Compute Node is reimaged, or if the Job Preparation Task did not complete (e.g. because the reboot occurred while the Task was running). Therefore, you should always write a Job Preparation Task to be idempotent and to behave correctly if run multiple times. The default value is true.
    UpgradeMode:
      type: string
      description: UpgradeMode enums
      enum:
      - automatic
      - manual
      - rolling
      x-ms-enum:
        name: UpgradeMode
        modelAsString: true
        values:
        - name: Automatic
          value: automatic
          description: All virtual machines in the scale set are automatically updated at the same time.
        - name: Manual
          value: manual
          description: You control the application of updates to virtual machines in the scale set. You do this by using the manualUpgrade action.
        - name: Rolling
          value: rolling
          description: The existing instances in a scale set are brought down in batches to be upgraded. Once the upgraded batch is complete, the instances will begin taking traffic again and the next batch will begin. This continues until all instances brought up-to-date.
    BatchJobManagerTask:
      type: object
      description: 'Specifies details of a Job Manager Task.

        The Job Manager Task is automatically started when the Job is created. The

        Batch service tries to schedule the Job Manager Task before any other Tasks in

        the Job. When shrinking a Pool, the Batch service tries to preserve Nodes where

        Job Manager Tasks are running for as long as possible (that is, Compute Nodes

        running ''normal'' Tasks are removed before Compute Nodes running Job Manager

        Tasks). When a Job Manager Task fails and needs to be restarted, the system

        tries to schedule it at the highest priority. If there are no idle Compute

        Nodes available, the system may terminate one of the running Tasks in the Pool

        and return it to the queue in order to make room for the Job Manager Task to

        restart. Note that a Job Manager Task in one Job does not have priority over

        Tasks in other Jobs. Across Jobs, only Job level priorities are observed. For

        example, if a Job Manager in a priority 0 Job needs to be restarted, it will

        not displace Tasks of a priority 1 Job. Batch will retry Tasks when a recovery

        operation is triggered on a Node. Examples of recovery operations include (but

        are not limited to) when an unhealthy Node is rebooted or a Compute Node

        disappeared due to host failure. Retries due to recovery operations are

        independent of and are not counted against the maxTaskRetryCount. Even if the

        maxTaskRetryCount is 0, an internal retry due to a recovery operation may

        occur. Because of this, all Tasks should be idempotent. This means Tasks need

        to tolerate being interrupted and restarted without causing any corruption or

        duplicate data. The best practice for long running Tasks is to use some form of

        checkpointing.'
      properties:
        id:
          type: string
          description: A string that uniquely identifies the Job Manager Task within the Job. The ID can contain any combination of alphanumeric characters including hyphens and underscores and cannot contain more than 64 characters.
        displayName:
          type: string
          description: The display name of the Job Manager Task. It need not be unique and can contain any Unicode characters up to a maximum length of 1024.
        commandLine:
          type: string
          description: The command line of the Job Manager Task. The command line does not run under a shell, and therefore cannot take advantage of shell features such as environment variable expansion. If you want to take advantage of such features, you should invoke the shell in the command line, for example using "cmd /c MyCommand" in Windows or "/bin/sh -c MyCommand" in Linux. If the command line refers to file paths, it should use a relative path (relative to the Task working directory), or use the Batch provided environment variable (https://learn.microsoft.com/azure/batch/batch-compute-node-environment-variables).
        containerSettings:
          $ref: '#/components/schemas/BatchTaskContainerSettings'
          description: The settings for the container under which the Job Manager Task runs. If the Pool that will run this Task has containerConfiguration set, this must be set as well. If the Pool that will run this Task doesn't have containerConfiguration set, this must not be set. When this is specified, all directories recursively below the AZ_BATCH_NODE_ROOT_DIR (the root of Azure Batch directories on the node) are mapped into the container, all Task environment variables are mapped into the container, and the Task command line is executed in the container. Files produced in the container outside of AZ_BATCH_NODE_ROOT_DIR might not be reflected to the host disk, meaning that Batch file APIs will not be able to access those files.
        resourceFiles:
          type: array
          description: A list of files that the Batch service will download to the Compute Node before running the command line. Files listed under this element are located in the Task's working directory. There is a maximum size for the list of resource files.  When the max size is exceeded, the request will fail and the response error code will be RequestEntityTooLarge. If this occurs, the collection of ResourceFiles must be reduced in size. This can be achieved using .zip files, Application Packages, or Docker Containers.
          items:
            $ref: '#/components/schemas/ResourceFile'
        outputFiles:
          type: array
          description: A list of files that the Batch service will upload from the Compute Node after running the command line. For multi-instance Tasks, the files will only be uploaded from the Compute Node on which the primary Task is executed.
          items:
            $ref: '#/components/schemas/OutputFile'
        environmentSettings:
          type: array
          description: A list of environment variable settings for the Job Manager Task.
          items:
            $ref: '#/components/schemas/EnvironmentSetting'
        constraints:
          $ref: '#/components/schemas/BatchTaskConstraints'
          description: Constraints that apply to the Job Manager Task.
        requiredSlots:
          type: integer
          format: int32
          description: The number of scheduling slots that the Task requires to run. The default is 1. A Task can only be scheduled to run on a compute node if the node has enough free scheduling slots available. For multi-instance Tasks, this property is not supported and must not be specified.
        killJobOnCompletion:
          type: boolean
          description: Whether completion of the Job Manager Task signifies completion of the entire Job. If true, when the Job Manager Task completes, the Batch service marks the Job as complete. If any Tasks are still running at this time (other than Job Release), those Tasks are terminated. If false, the completion of the Job Manager Task does not affect the Job status. In this case, you should either use the onAllTasksComplete attribute to terminate the Job, or have a client or user terminate the Job explicitly. An example of this is if the Job Manager creates a set of Tasks but then takes no further role in their execution. The default value is true. If you are using the onAllTasksComplete and onTaskFailure attributes to control Job lifetime, and using the Job Manager Task only to create the Tasks for the Job (not to monitor progress), then it is important to set killJobOnCompletion to false.
        userIdentity:
          $ref: '#/components/schemas/UserIdentity'
          description: The user identity under which the Job Manager Task runs. If omitted, the Task runs as a non-administrative user unique to the Task.
        runExclusive:
          type: boolean
          description: Whether the Job Manager Task requires exclusive use of the Compute Node where it runs. If true, no other Tasks will run on the same Node for as long as the Job Manager is running. If false, other Tasks can run simultaneously with the Job Manager on a Compute Node. The Job Manager Task counts normally against the Compute Node's concurrent Task limit, so this is only relevant if the Compute Node allows multiple concurrent Tasks. The default value is true.
        applicationPackageReferences:
          type: array
          description: 'A list of Application Packages that the Batch service will deploy to the

            Compute Node before running the command line.Application Packages are

            downloaded and deployed to a shared directory, not the Task working

            directory. Therefore, if a referenced Application Package is already

            on the Compute Node, and is up to date, then it is not re-downloaded;

            the existing copy on the Compute Node is used. If a referenced Application

            Package cannot be installed, for example because the package has been deleted

            or because download failed, the Task fails.'
          items:
            $ref: '#/components/schemas/BatchApplicationPackageReference'
        allowLowPriorityNode:
          type: boolean
          description: Whether the Job Manager Task may run on a Spot/Low-priority Compute Node. The default value is true.
      required:
      - id
      - commandLine
    DiskEncryptionSetParameters:
      type: object
      description: The ARM resource id of the disk encryption set.
      properties:
        id:
          type: string
          format: arm-id
          description: The ARM resource id of the disk encryption set. The resource must be in the same subscription as the Batch account.
    DiskEncryptionConfiguration:
      type: object
      description: 'The disk encryption configuration applied on compute nodes in the pool.

        Disk encryption configuration is not supported on Linux pool created with

        Azure Compute Gallery Image.'
      properties:
        customerManagedKey:
          $ref: '#/components/schemas/DiskCustomerManagedKey'
          description: The Customer Managed Key reference to encrypt the OS Disk. Customer Managed Key will encrypt OS Disk by EncryptionAtRest, and by default we will encrypt the data disk as well. It can be used only when the pool is configured with an identity and OsDisk is set as one of the targets of DiskEncryption.
        targets:
          type: array
          description: The list of disk targets Batch Service will encrypt on the compute node. The list of disk targets Batch Service will encrypt on the compute node.
          items:
            $ref: '#/components/schemas/DiskEncryptionTarget'
    BatchAllTasksCompleteMode:
      type: string
      description: The action the Batch service should take when all Tasks in the Job are in the completed state.
      enum:
      - noaction
      - terminatejob
      x-ms-enum:
        name: BatchAllTasksCompleteMode
        modelAsString: true
        values:
        - name: NoAction
          value: noaction
          description: Do nothing. The Job remains active unless terminated or disabled by some other means.
        - name: TerminateJob
          value: terminatejob
          description: Terminate the Job. The Job's terminationReason is set to 'AllTasksComplete'.
    NfsMountConfiguration:
      type: object
      description: Information used to connect to an NFS file system.
      properties:
        source:
          type: string
          description: The URI of the file system to mount.
        relativeMountPath:
          type: string
          description: The relative path on the compute node where the file system will be mounted. All file systems are mounted relative to the Batch mounts directory, accessible via the AZ_BATCH_NODE_MOUNTS_DIR environment variable.
        mountOptions:
          type: string
          description: Additional command line options to pass to the mount command. These are 'net use' options in Windows and 'mount' options in Linux.
      required:
      - source
      - relativeMountPath
    BatchJobScheduleConfiguration:
      type: object
      description: 'The schedule according to which Jobs will be created. All times are fixed

        respective to UTC and are not impacted by daylight saving time.'
      properties:
        doNotRunUntil:
          type: string
          format: date-time
          description: The earliest time at which any Job may be created under this Job Schedule. If you do not specify a doNotRunUntil time, the schedule becomes ready to create Jobs immediately.
        doNotRunAfter:
          type: string
          format: date-time
          description: A time after which no Job will be created under this Job Schedule. The schedule will move to the completed state as soon as this deadline is past and there is no active Job under this Job Schedule. If you do not specify a doNotRunAfter time, and you are creating a recurring Job Schedule, the Job Schedule will remain active until you explicitly terminate it.
        startWindow:
          type: string
          format: duration
          description: The time interval, starting from the time at which the schedule indicates a Job should be created, within which a Job must be created. If a Job is not created within the startWindow interval, then the 'opportunity' is lost; no Job will be created until the next recurrence of the schedule. If the schedule is recurring, and the startWindow is longer than the recurrence interval, then this is equivalent to an infinite startWindow, because the Job that is 'due' in one recurrenceInterval is not carried forward into the next recurrence interval. The default is infinite. The minimum value is 1 minute. If you specify a lower value, the Batch service rejects the schedule with an error; if you are calling the REST API directly, the HTTP status code is 400 (Bad Request). The time duration is specified in ISO 8601 format.
        recurrenceInterval:
          type: string
          format: duration
          description: 'The time interval between the start times of two successive Jobs under the Job Schedule. A Job Schedule can have at most one active Job under it at any given time. Because a Job Schedule can have at most one active Job under it at any given time, if it is time to create a new Job under a Job Schedule, but the previous Job is still running, the Batch service will not create the new Job until the previous Job finishes. If the previous Job does not finish within the startWindow period of the new recurrenceInterval, then no new Job will be scheduled for that interval. For recurring Jobs, you should normally specify a jobManagerTask in the jobSpecification. If you do not use jobManagerTask, you will need an external process to monitor when Jobs are created, add Tasks to the Jobs and terminate the Jobs ready for the next recurrence. The default is that the schedule does not recur: one Job is created, within the startWindow after the doNotRunUntil time, and the schedule is complete as soon as that Job finishes. The minimum value is 1 minute. If you specify a lower value, the Batch service rejects the schedule with an error; if you are calling the REST API directly, the HTTP status code is 400 (Bad Request). The time duration is specified in ISO 8601 format.'
    HostEndpointSettings:
      type: object
      description: Specifies particular host endpoint settings.
      properties:
        inVMAccessControlProfileReferenceId:
          type: string
          description: Specifies the reference to the InVMAccessControlProfileVersion resource id in the form of /subscriptions/{SubscriptionId}/resourceGroups/{ResourceGroupName}/providers/Microsoft.Compute/galleries/{galleryName}/inVMAccessControlProfiles/{profile}/versions/{version}.
          x-ms-client-name: inVmAccessControlProfileReferenceId
        mode:
          $ref: '#/components/schemas/HostEndpointSettingsModeTypes'
          description: Specifies the access control policy execution mode.
    BatchJobSchedule:
      type: object
      description: 'A Job Schedule that allows recurring Jobs by specifying when to run Jobs and a

        specification used to create each Job.'
      properties:
        id:
          type: string
          description: A string that uniquely identifies the schedule within the Account.
          readOnly: true
        displayName:
          type: string
          description: The display name for the schedule.
          readOnly: true
        url:
          type: string
          format: uri
          description: The URL of the Job Schedule.
          readOnly: true
        eTag:
          $ref: '#/components/schemas/Azure.Core.eTag'
          description: The ETag of the Job Schedule. This is an opaque string. You can use it to detect whether the Job Schedule has changed between requests. In particular, you can be pass the ETag with an Update Job Schedule request to specify that your changes should take effect only if nobody else has modified the schedule in the meantime.
          readOnly: true
        lastModified:
          type: string
          format: date-time
          description: The last modified time of the Job Schedule. This is the last time at which the schedule level data, such as the Job specification or recurrence information, changed. It does not factor in job-level changes such as new Jobs being created or Jobs changing state.
          readOnly: true
        creationTime:
          type: string
          format: date-time
          description: The creation time of the Job Schedule.
          readOnly: true
        state:
          $ref: '#/components/schemas/BatchJobScheduleState'
          description: The current state of the Job Schedule.
          readOnly: true
        stateTransitionTime:
          type: string
          format: date-time
          description: The time at which the Job Schedule entered the current state.
          readOnly: true
        previousState:
          $ref: '#/components/schemas/BatchJobScheduleState'
          description: The previous state of the Job Schedule. This property is not present if the Job Schedule is in its initial active state.
          readOnly: true
        previousStateTransitionTime:
          type: string
          format: date-time
          description: The time at which the Job Schedule entered its previous state. This property is not present if the Job Schedule is in its initial active state.
          readOnly: true
        schedule:
          $ref: '#/components/schemas/BatchJobScheduleConfiguration'
          description: The schedule according to which Jobs will be created. All times are fixed respective to UTC and are not impacted by daylight saving time.
        jobSpecification:
          $ref: '#/components/schemas/BatchJobSpecification'
          description: The details of the Jobs to be created on this schedule.
        executionInfo:
          $ref: '#/components/schemas/BatchJobScheduleExecutionInfo'
          description: Information about Jobs that have been and will be run under this schedule.
          readOnly: true
        metadata:
          type: array
          description: A list of name-value pairs associated with the schedule as metadata. The Batch service does not assign any meaning to metadata; it is solely for the use of user code.
          items:
            $ref: '#/components/schemas/BatchMetadataItem'
        stats:
          $ref: '#/components/schemas/BatchJobScheduleStatistics'
          description: The lifetime resource usage statistics for the Job Schedule. The statistics may not be immediately available. The Batch service performs periodic roll-up of statistics. The typical delay is about 30 minutes.
          readOnly: true
          x-ms-client-name: jobScheduleStatistics
      required:
      - id
      - url
      - eTag
      - lastModified
      - creationTime
      - state
      - stateTransitionTime
      - jobSpecification
      - executionInfo
    BatchJobNetworkConfiguration:
      type: object
      description: (This property is not available by default. Please contact support for more information) The network configuration for the Job.
      properties:
        subnetId:
          type: string
          description: 'The ARM resource identifier of the virtual network subnet which Compute Nodes running Tasks from the Job will join for the duration of the Task. The virtual network must be in the same region and subscription as the Azure Batch Account. The specified subnet should have enough free IP addresses to accommodate the number of Compute Nodes which will run Tasks from the Job. This can be up to the number of Compute Nodes in the Pool. The ''MicrosoftAzureBatch'' service principal must have the ''Classic Virtual Machine Contributor'' Role-Based Access Control (RBAC) role for the specified VNet so that Azure Batch service can schedule Tasks on the Nodes. This can be verified by checking if the specified VNet has any associated Network Security Groups (NSG). If communication to the Nodes in the specified subnet is denied by an NSG, then the Batch service will set the state of the Compute Nodes to unusable. This is of the form /subscriptions/{subscription}/resourceGroups/{group}/providers/{provider}/virtualNetworks/{network}/subnets/{subnet}. If the specified VNet has any associated Network Security Groups (NSG), then a few reserved system ports must be enabled for inbound communication from the Azure Batch service. For Pools created with a Virtual Machine configuration, enable ports 29876 and 29877, as well as port 22 for Linux and port 3389 for Windows. Port 443 is also required to be open for outbound connections for communications to Azure Storage. For more details see: https://learn.microsoft.com/azure/batch/batch-api-basics#virtual-network-vnet-and-firewall-configuration.'
        skipWithdrawFromVNet:
          type: boolean
          description: Whether to withdraw Compute Nodes from the virtual network to DNC when the job is terminated or deleted.  If true, nodes will remain joined to the virtual network to DNC. If false, nodes will automatically withdraw when the job ends. Defaults to false.
          x-ms-client-name: skipWithdrawFromVnet
      required:
      - subnetId
    BatchPoolIdentityReference:
      type: object
      description: The reference of one of the pool identities to encrypt Disk. This identity will be used to access the key vault.
      properties:
        resourceId:
          type: string
          format: arm-id
          description: The ARM resource id of the user assigned identity. This reference must be included in the pool identities.
    ManagedDisk:
      type: object
      description: The managed disk parameters.
      properties:
        diskEncryptionSet:
          $ref: '#/components/schemas/DiskEncryptionSetParameters'
          description: Specifies the customer managed disk encryption set resource id for the managed disk. It can be set only in UserSubscription mode.
        storageAccountType:
          $ref: '#/components/schemas/StorageAccountType'
          description: The storage account type for managed disk.
        securityProfile:
          $ref: '#/components/schemas/BatchVmDiskSecurityProfile'
          description: Specifies the security profile settings for the managed disk.
    BatchJobScheduleStatistics:
      type: object
      description: Resource usage statistics for a Job Schedule.
      properties:
        url:
          type: string
          format: uri
          description: The URL of the statistics.
        startTime:
          type: string
          format: date-time
          description: The start time of the time range covered by the statistics.
        lastUpdateTime:
          type: string
          format: date-time
          description: The time at which the statistics were last updated. All statistics are limited to the range between startTime and lastUpdateTime.
        userCPUTime:
          type: string
          format: duration
          description: The total user mode CPU time (summed across all cores and all Compute Nodes) consumed by all Tasks in all Jobs created under the schedule. The time duration is specified in ISO 8601 format.
          x-ms-client-name: userCpuTime
        kernelCPUTime:
          type: string
          format: duration
          description: The total kernel mode CPU time (summed across all cores and all Compute Nodes) consumed by all Tasks in all Jobs created under the schedule. The time duration is specified in ISO 8601 format.
          x-ms-client-name: kernelCpuTime
        wallClockTime:
          type: string
          format: duration
          description: The total wall clock time of all the Tasks in all the Jobs created under the schedule. The wall clock time is the elapsed time from when the Task started running on a Compute Node to when it finished (or to the last time the statistics were updated, if the Task had not finished by then). If a Task was retried, this includes the wall clock time of all the Task retries. The time duration is specified in ISO 8601 format.
        readIOps:
          type: string
          format: int64
          description: The total number of disk read operations made by all Tasks in all Jobs created under the schedule.
          x-ms-client-name: readIops
        writeIOps:
          type: string
          format: int64
          description: The total number of disk write operations made by all Tasks in all Jobs created under the schedule.
          x-ms-client-name: writeIops
        readIOGiB:
          type: number
          format: float
          description: The total gibibytes read from disk by all Tasks in all Jobs created under the schedule.
          x-ms-client-name: readIoGiB
        writeIOGiB:
          type: number
          format: float
          description: The total gibibytes written to disk by all Tasks in all Jobs created under the schedule.
          x-ms-client-name: writeIoGiB
        numSucceededTasks:
          type: string
          format: int64
          description: The total number of Tasks successfully completed during the given time range in Jobs created under the schedule. A Task completes successfully if it returns exit code 0.
          x-ms-client-name: succeededTasksCount
        numFailedTasks:
          type: string
          format: int64
          description: The total number of Tasks that failed during the given time range in Jobs created under the schedule. A Task fails if it exhausts its maximum retry count without returning exit code 0.
          x-ms-client-name: failedTasksCount
        numTaskRetries:
          type: string
          format: int64
          description: The total number of retries during the given time range on all Tasks in all Jobs created under the schedule.
          x-ms-client-name: taskRetriesCount
        waitTime:
          type: string
          format: duration
          description: The total wait time of all Tasks in all Jobs created under the schedule. The wait time for a Task is defined as the elapsed time between the creation of the Task and the start of Task execution. (If the Task is retried due to failures, the wait time is the time to the most recent Task execution.). This value is only reported in the Account lifetime statistics; it is not included in the Job statistics. The time duration is specified in ISO 8601 format.
      required:
      - url
      - startTime
      - lastUpdateTime
      - userCPUTime
      - kernelCPUTime
      - wallClockTime
      - readIOps
      - writeIOps
      - readIOGiB
      - writeIOGiB
      - numSucceededTasks
      - numFailedTasks
      - numTaskRetries
      - waitTime
    BatchNodeFillType:
      type: string
      description: BatchNodeFillType enums
      enum:
      - spread
      - pack
      x-ms-enum:
        name: BatchNodeFillType
        modelAsString: true
        values:
        - name: Spread
          value: spread
          description: Tasks should be assigned evenly across all Compute Nodes in the Pool.
        - name: Pack
          value: pack
          description: As many Tasks as possible (taskSlotsPerNode) should be assigned to each Compute Node in the Pool before any Tasks are assigned to the next Compute Node in the Pool.
    BatchDiffDiskSettings:
      type: object
      description: 'Specifies the ephemeral Disk Settings for the operating system disk used by the

        compute node (VM).'
      properties:
        placement:
          $ref: '#/components/schemas/DiffDiskPlacement'
          description: Specifies the ephemeral disk placement for operating system disk for all VMs in the pool. This property can be used by user in the request to choose the location e.g., cache disk space for Ephemeral OS disk provisioning. For more information on Ephemeral OS disk size requirements, please refer to Ephemeral OS disk size requirements for Windows VMs at https://learn.microsoft.com/azure/virtual-machines/windows/ephemeral-os-disks#size-requirements and Linux VMs at https://learn.microsoft.com/azure/virtual-machines/linux/ephemeral-os-disks#size-requirements.
    BatchTaskConstraints:
      type: object
      description: Execution constraints to apply to a Task.
      properties:
        maxWallClockTime:
          type: string
          format: duration
          description: The maximum elapsed time that the Task may run, measured from the time the Task starts. If the Task does not complete within the time limit, the Batch service terminates it. If this is not specified, there is no time limit on how long the Task may run. The time duration is specified in ISO 8601 format.
        retentionTime:
          type: string
          format: duration
          description: The minimum time to retain the Task directory on the Compute Node where it ran, from the time it completes execution. After this time, the Batch service may delete the Task directory and all its contents. The default is 7 days, i.e. the Task directory will be retained for 7 days unless the Compute Node is removed or the Job is deleted. The time duration is specified in ISO 8601 format.
        maxTaskRetryCount:
          type: integer
          format: int32
          description: The maximum number of times the Task may be retried. The Batch service retries a Task if its exit code is nonzero. Note that this value specifically controls the number of retries for the Task executable due to a nonzero exit code. The Batch service will try the Task once, and may then retry up to this limit. For example, if the maximum retry count is 3, Batch tries the Task up to 4 times (one initial try and 3 retries). If the maximum retry count is 0, the Batch service does not retry the Task after the first attempt. If the maximum retry count is -1, the Batch service retries the Task without limit, however this is not recommended for a start task or any task. The default value is 0 (no retries).
    VirtualMachineConfiguration:
      type: object
      description: 'The configuration for Compute Nodes in a Pool based on the Azure Virtual

        Machines infrastructure.'
      properties:
        imageReference:
          $ref: '#/components/schemas/BatchVmImageReference'
          description: A reference to the Azure Virtual Machines Marketplace Image or the custom Virtual Machine Image to use.
        nodeAgentSKUId:
          type: string
          description: The SKU of the Batch Compute Node agent to be provisioned on Compute Nodes in the Pool. The Batch Compute Node agent is a program that runs on each Compute Node in the Pool, and provides the command-and-control interface between the Compute Node and the Batch service. There are different implementations of the Compute Node agent, known as SKUs, for different operating systems. You must specify a Compute Node agent SKU which matches the selected Image reference. To get the list of supported Compute Node agent SKUs along with their list of verified Image references, see the 'List supported Compute Node agent SKUs' operation.
          x-ms-client-name: nodeAgentSkuId
        windowsConfiguration:
          $ref: '#/components/schemas/WindowsConfiguration'
          description: Windows operating system settings on the virtual machine. This property must not be specified if the imageReference property specifies a Linux OS Image.
        dataDisks:
          type: array
          description: The configuration for data disks attached to the Compute Nodes in the Pool. This property must be specified if the Compute Nodes in the Pool need to have empty data disks attached to them. This cannot be updated. Each Compute Node gets its own disk (the disk is not a file share). Existing disks cannot be attached, each attached disk is empty. When the Compute Node is removed from the Pool, the disk and all data associated with it is also deleted. The disk is not formatted after being attached, it must be formatted before use - for more information see https://learn.microsoft.com/azure/virtual-machines/linux/classic/attach-disk#initialize-a-new-data-disk-in-linux and https://learn.microsoft.com/azure/virtual-machines/windows/attach-disk-ps#add-an-empty-data-disk-to-a-virtual-machine.
          items:
            $ref: '#/components/schemas/DataDisk'
        licenseType:
          type: string
          description: "This only applies to Images that contain the Windows operating system, and\nshould only be used when you hold valid on-premises licenses for the Compute\nNodes which will be deployed. If omitted, no on-premises licensing discount is\napplied. Values are:\n\n Windows_Server - The on-premises license is for Windows\nServer.\n Windows_Client - The on-premises license is for Windows Client.\n"
        containerConfiguration:
          $ref: '#/components/schemas/BatchContainerConfiguration'
          description: The container configuration for the Pool. If specified, setup is performed on each Compute Node in the Pool to allow Tasks to run in containers. All regular Tasks and Job manager Tasks run on this Pool must specify the containerSettings property, and all other Tasks may specify it.
        diskEncryptionConfiguration:
          $ref: '#/components/schemas/DiskEncryptionConfiguration'
          description: The disk encryption configuration for the pool. If specified, encryption is performed on each node in the pool during node provisioning.
        nodePlacementConfiguration:
          $ref: '#/components/schemas/BatchNodePlacementConfiguration'
          description: The node placement configuration for the pool. This configuration will specify rules on how nodes in the pool will be physically allocated.
        extensions:
          type: array
          description: The virtual machine extension for the pool. If specified, the extensions mentioned in this configuration will be installed on each node.
          items:
            $ref: '#/components/schemas/VMExtension'
        osDisk:
          $ref: '#/components/schemas/BatchOsDisk'
          description: Settings for the operating system disk of the Virtual Machine.
          x-ms-client-name: OsDisk
        securityProfile:
          $ref: '#/components/schemas/SecurityProfile'
          description: Specifies the security profile settings for the virtual machine or virtual machine scale set.
        serviceArtifactReference:
          $ref: '#/components/schemas/ServiceArtifactReference'
          description: Specifies the service artifact reference id used to set same image version for all virtual machines in the scale set when using 'latest' image version. The service artifact reference id in the form of /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.Compute/galleries/{galleryName}/serviceArtifacts/{serviceArtifactName}/vmArtifactsProfiles/{vmArtifactsProfilesName}
      required:
      - imageReference
      - nodeAgentSKUId
    BatchJobScheduleState:
      type: string
      description: BatchJobScheduleState enums
      enum:
      - active
      - completed
      - disabled
      - terminating
      - deleting
      x-ms-enum:
        name: BatchJobScheduleState
        modelAsString: true
        values:
        - name: Active
          value: active
          description: The Job Schedule is active and will create Jobs as per its schedule.
        - name: Completed
          value: completed
          description: The Job Schedule has terminated, either by reaching its end time or by the user terminating it explicitly.
        - name: Disabled
          value: disabled
          description: The user has disabled the Job Schedule. The scheduler will not initiate any new Jobs will on this schedule, but any existing active Job will continue to run.
        - name: Terminating
          value: terminating
          description: The Job Schedule has no more work to do, or has been explicitly terminated by the user, but the termination operation is still in progress. The scheduler will not initiate any new Jobs for this Job Schedule, nor is any existing Job active.
        - name: Deleting
          value: deleting
          description: The user has requested that the Job Schedule be deleted, but the delete operation is still in progress. The scheduler will not initiate any new Jobs for this Job Schedule, and will delete any existing Jobs and Tasks under the Job Schedule, including any active Job. The Job Schedule will be deleted when all Jobs and Tasks under the Job Schedule have been deleted.
  parameters:
    Azure.Core.Foundations.ApiVersionParameter:
      name: api-version
      in: query
      description: The API version to use for this operation.
      required: true
