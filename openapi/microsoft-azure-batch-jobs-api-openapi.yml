    BatchJobNetworkConfigurationUpdate:
      type: object
      description: (This property is not available by default. Please contact support for more information) The network configuration for the Job.
      properties:
        subnetId:
          type: string
          description: 'The ARM resource identifier of the virtual network subnet which Compute Nodes running Tasks from the Job will join for the duration of the Task. The virtual network must be in the same region and subscription as the Azure Batch Account. The specified subnet should have enough free IP addresses to accommodate the number of Compute Nodes which will run Tasks from the Job. This can be up to the number of Compute Nodes in the Pool. The ''MicrosoftAzureBatch'' service principal must have the ''Classic Virtual Machine Contributor'' Role-Based Access Control (RBAC) role for the specified VNet so that Azure Batch service can schedule Tasks on the Nodes. This can be verified by checking if the specified VNet has any associated Network Security Groups (NSG). If communication to the Nodes in the specified subnet is denied by an NSG, then the Batch service will set the state of the Compute Nodes to unusable. This is of the form /subscriptions/{subscription}/resourceGroups/{group}/providers/{provider}/virtualNetworks/{network}/subnets/{subnet}. If the specified VNet has any associated Network Security Groups (NSG), then a few reserved system ports must be enabled for inbound communication from the Azure Batch service. For Pools created with a Virtual Machine configuration, enable ports 29876 and 29877, as well as port 22 for Linux and port 3389 for Windows. Port 443 is also required to be open for outbound connections for communications to Azure Storage. For more details see: https://learn.microsoft.com/azure/batch/batch-api-basics#virtual-network-vnet-and-firewall-configuration.'
        skipWithdrawFromVNet:
          type: boolean
          description: Whether to withdraw Compute Nodes from the virtual network to DNC when the job is terminated or deleted.  If true, nodes will remain joined to the virtual network to DNC. If false, nodes will automatically withdraw when the job ends. Defaults to false.
          x-ms-client-name: skipWithdrawFromVnet
    DynamicVNetAssignmentScope:
      type: string
      description: DynamicVNetAssignmentScope enums
      enum:
      - none
      - job
      x-ms-enum:
        name: DynamicVNetAssignmentScope
        modelAsString: true
        values:
        - name: None
          value: none
          description: No dynamic VNet assignment is enabled.
        - name: Job
          value: job
          description: Dynamic VNet assignment is done per-job.
    BatchStartTask:
      type: object
      description: 'Batch will retry Tasks when a recovery operation is triggered on a Node.

        Examples of recovery operations include (but are not limited to) when an

        unhealthy Node is rebooted or a Compute Node disappeared due to host failure.

        Retries due to recovery operations are independent of and are not counted

        against the maxTaskRetryCount. Even if the maxTaskRetryCount is 0, an internal

        retry due to a recovery operation may occur. Because of this, all Tasks should

        be idempotent. This means Tasks need to tolerate being interrupted and

        restarted without causing any corruption or duplicate data. The best practice

        for long running Tasks is to use some form of checkpointing. In some cases the

        StartTask may be re-run even though the Compute Node was not rebooted. Special

        care should be taken to avoid StartTasks which create breakaway process or

        install/launch services from the StartTask working directory, as this will

        block Batch from being able to re-run the StartTask.'
      properties:
        commandLine:
          type: string
          description: The command line of the StartTask. The command line does not run under a shell, and therefore cannot take advantage of shell features such as environment variable expansion. If you want to take advantage of such features, you should invoke the shell in the command line, for example using "cmd /c MyCommand" in Windows or "/bin/sh -c MyCommand" in Linux. If the command line refers to file paths, it should use a relative path (relative to the Task working directory), or use the Batch provided environment variable (https://learn.microsoft.com/azure/batch/batch-compute-node-environment-variables).
        containerSettings:
          $ref: '#/components/schemas/BatchTaskContainerSettings'
          description: The settings for the container under which the StartTask runs. When this is specified, all directories recursively below the AZ_BATCH_NODE_ROOT_DIR (the root of Azure Batch directories on the node) are mapped into the container, all Task environment variables are mapped into the container, and the Task command line is executed in the container. Files produced in the container outside of AZ_BATCH_NODE_ROOT_DIR might not be reflected to the host disk, meaning that Batch file APIs will not be able to access those files.
        resourceFiles:
          type: array
          description: A list of files that the Batch service will download to the Compute Node before running the command line.  There is a maximum size for the list of resource files. When the max size is exceeded, the request will fail and the response error code will be RequestEntityTooLarge. If this occurs, the collection of ResourceFiles must be reduced in size. This can be achieved using .zip files, Application Packages, or Docker Containers. Files listed under this element are located in the Task's working directory.
          items:
            $ref: '#/components/schemas/ResourceFile'
        environmentSettings:
          type: array
          description: A list of environment variable settings for the StartTask.
          items:
            $ref: '#/components/schemas/EnvironmentSetting'
        userIdentity:
          $ref: '#/components/schemas/UserIdentity'
          description: The user identity under which the StartTask runs. If omitted, the Task runs as a non-administrative user unique to the Task.
        maxTaskRetryCount:
          type: integer
          format: int32
          description: The maximum number of times the Task may be retried. The Batch service retries a Task if its exit code is nonzero. Note that this value specifically controls the number of retries. The Batch service will try the Task once, and may then retry up to this limit. For example, if the maximum retry count is 3, Batch tries the Task up to 4 times (one initial try and 3 retries). If the maximum retry count is 0, the Batch service does not retry the Task. If the maximum retry count is -1, the Batch service retries the Task without limit, however this is not recommended for a start task or any task. The default value is 0 (no retries).
        waitForSuccess:
          type: boolean
          description: Whether the Batch service should wait for the StartTask to complete successfully (that is, to exit with exit code 0) before scheduling any Tasks on the Compute Node. If true and the StartTask fails on a Node, the Batch service retries the StartTask up to its maximum retry count (maxTaskRetryCount). If the Task has still not completed successfully after all retries, then the Batch service marks the Node unusable, and will not schedule Tasks to it. This condition can be detected via the Compute Node state and failure info details. If false, the Batch service will not wait for the StartTask to complete. In this case, other Tasks can start executing on the Compute Node while the StartTask is still running; and even if the StartTask fails, new Tasks will continue to be scheduled on the Compute Node. The default is true.
      required:
      - commandLine
    BatchTaskConstraints:
      type: object
      description: Execution constraints to apply to a Task.
      properties:
        maxWallClockTime:
          type: string
          format: duration
          description: The maximum elapsed time that the Task may run, measured from the time the Task starts. If the Task does not complete within the time limit, the Batch service terminates it. If this is not specified, there is no time limit on how long the Task may run. The time duration is specified in ISO 8601 format.
        retentionTime:
          type: string
          format: duration
          description: The minimum time to retain the Task directory on the Compute Node where it ran, from the time it completes execution. After this time, the Batch service may delete the Task directory and all its contents. The default is 7 days, i.e. the Task directory will be retained for 7 days unless the Compute Node is removed or the Job is deleted. The time duration is specified in ISO 8601 format.
        maxTaskRetryCount:
          type: integer
          format: int32
          description: The maximum number of times the Task may be retried. The Batch service retries a Task if its exit code is nonzero. Note that this value specifically controls the number of retries for the Task executable due to a nonzero exit code. The Batch service will try the Task once, and may then retry up to this limit. For example, if the maximum retry count is 3, Batch tries the Task up to 4 times (one initial try and 3 retries). If the maximum retry count is 0, the Batch service does not retry the Task after the first attempt. If the maximum retry count is -1, the Batch service retries the Task without limit, however this is not recommended for a start task or any task. The default value is 0 (no retries).
    SecurityProfile:
      type: object
      description: Specifies the security profile settings for the virtual machine or virtual machine scale set.
      properties:
        encryptionAtHost:
          type: boolean
          description: This property can be used by user in the request to enable or disable the Host Encryption for the virtual machine or virtual machine scale set. This will enable the encryption for all the disks including Resource/Temp disk at host itself. For more information on encryption at host requirements, please refer to https://learn.microsoft.com/azure/virtual-machines/disk-encryption#supported-vm-sizes.
        proxyAgentSettings:
          $ref: '#/components/schemas/ProxyAgentSettings'
          description: Specifies ProxyAgent settings while creating the virtual machine.
        securityType:
          $ref: '#/components/schemas/SecurityTypes'
          description: Specifies the SecurityType of the virtual machine. It has to be set to any specified value to enable UefiSettings.
        uefiSettings:
          $ref: '#/components/schemas/BatchUefiSettings'
          description: Specifies the security settings like secure boot and vTPM used while creating the virtual machine. Specifies the security settings like secure boot and vTPM used while creating the virtual machine.
    BatchErrorMessage:
