    BatchTaskSchedulingPolicyUpdate:
      type: object
      description: Specifies how Tasks should be distributed across Compute Nodes.
      properties:
        jobDefaultOrder:
          type: string
          description: The order for scheduling tasks from different jobs with the same priority. If not specified, the default is none.
