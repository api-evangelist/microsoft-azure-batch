        modelAsString: true
        values:
        - name: Audit
          value: Audit
          description: In Audit mode, the system acts as if it is enforcing the access control policy, including emitting access denial entries in the logs but it does not actually deny any requests to host endpoints.
        - name: Enforce
          value: Enforce
          description: Enforce mode is the recommended mode of operation and system will enforce the access control policy. This property cannot be used together with 'inVMAccessControlProfileReferenceId'.
    ContainerHostDataPath:
      type: string
      description: The paths which will be mounted to container task's container.
      enum:
      - Shared
      - Startup
      - VfsMounts
      - Task
      - JobPrep
      - Applications
      x-ms-enum:
        name: ContainerHostDataPath
        modelAsString: true
        values:
        - name: Shared
          value: Shared
          description: The path for multi-instances task to shared their files.
        - name: Startup
          value: Startup
          description: The path for start task.
        - name: VfsMounts
