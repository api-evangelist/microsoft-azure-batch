    NetworkConfiguration:
      type: object
      description: The network configuration for a Pool.
      properties:
        subnetId:
          type: string
          description: 'The ARM resource identifier of the virtual network subnet which the Compute Nodes of the Pool will join. This is of the form /subscriptions/{subscription}/resourceGroups/{group}/providers/{provider}/virtualNetworks/{network}/subnets/{subnet}. The virtual network must be in the same region and subscription as the Azure Batch Account. The specified subnet should have enough free IP addresses to accommodate the number of Compute Nodes in the Pool. If the subnet doesn''t have enough free IP addresses, the Pool will partially allocate Nodes and a resize error will occur. The ''MicrosoftAzureBatch'' service principal must have the ''Classic Virtual Machine Contributor'' Role-Based Access Control (RBAC) role for the specified VNet. The specified subnet must allow communication from the Azure Batch service to be able to schedule Tasks on the Nodes. This can be verified by checking if the specified VNet has any associated Network Security Groups (NSG). If communication to the Nodes in the specified subnet is denied by an NSG, then the Batch service will set the state of the Compute Nodes to unusable. Only ARM virtual networks (''Microsoft.Network/virtualNetworks'') are supported. If the specified VNet has any associated Network Security Groups (NSG), then a few reserved system ports must be enabled for inbound communication, including ports 29876 and 29877. Also enable outbound connections to Azure Storage on port 443. For more details see: https://learn.microsoft.com/azure/batch/nodes-and-pools#virtual-network-vnet-and-firewall-configuration'
        dynamicVNetAssignmentScope:
          $ref: '#/components/schemas/DynamicVNetAssignmentScope'
          description: The scope of dynamic vnet assignment.
          x-ms-client-name: dynamicVnetAssignmentScope
        endpointConfiguration:
          $ref: '#/components/schemas/BatchPoolEndpointConfiguration'
          description: The configuration for endpoints on Compute Nodes in the Batch Pool.
        publicIPAddressConfiguration:
          $ref: '#/components/schemas/BatchPublicIpAddressConfiguration'
          description: The Public IPAddress configuration for Compute Nodes in the Batch Pool.
          x-ms-client-name: publicIpAddressConfiguration
        enableAcceleratedNetworking:
          type: boolean
          description: 'Whether this pool should enable accelerated networking. Accelerated networking enables single root I/O virtualization (SR-IOV) to a VM, which may lead to improved networking performance. For more details, see: https://learn.microsoft.com/azure/virtual-network/accelerated-networking-overview.'
    OutputFile:
      type: object
      description: On every file uploads, Batch service writes two log files to the compute node, 'fileuploadout.txt' and 'fileuploaderr.txt'. These log files are used to learn more about a specific failure.
      properties:
        filePattern:
          type: string
          description: 'A pattern indicating which file(s) to upload. Both relative and absolute paths are supported. Relative paths are relative to the Task working directory. The following wildcards are supported: * matches 0 or more characters (for example pattern abc* would match abc or abcdef), ** matches any directory, ? matches any single character, [abc] matches one character in the brackets, and [a-c] matches one character in the range. Brackets can include a negation to match any character not specified (for example [!abc] matches any character but a, b, or c). If a file name starts with "." it is ignored by default but may be matched by specifying it explicitly (for example *.gif will not match .a.gif, but .*.gif will). A simple example: **\*.txt matches any file that does not start in ''.'' and ends with .txt in the Task working directory or any subdirectory. If the filename contains a wildcard character it can be escaped using brackets (for example abc[*] would match a file named abc*). Note that both \ and / are treated as directory separators on Windows, but only / is on Linux. Environment variables (%var% on Windows or $var on Linux) are expanded prior to the pattern being applied.'
        destination:
          $ref: '#/components/schemas/OutputFileDestination'
          description: The destination for the output file(s).
        uploadOptions:
          $ref: '#/components/schemas/OutputFileUploadConfig'
          description: Additional options for the upload operation, including under what conditions to perform the upload.
      required:
      - filePattern
      - destination
      - uploadOptions
    BatchTaskExecutionResult:
      type: string
      description: BatchTaskExecutionResult enums
      enum:
      - success
      - failure
      x-ms-enum:
        name: BatchTaskExecutionResult
        modelAsString: true
        values:
        - name: Success
          value: success
          description: The Task ran successfully.
        - name: Failure
          value: failure
          description: There was an error during processing of the Task. The failure may have occurred before the Task process was launched, while the Task process was executing, or after the Task process exited.
    NetworkConfigurationUpdate:
      type: object
      description: The network configuration for a Pool.
      properties:
        subnetId:
          type: string
          description: 'The ARM resource identifier of the virtual network subnet which the Compute Nodes of the Pool will join. This is of the form /subscriptions/{subscription}/resourceGroups/{group}/providers/{provider}/virtualNetworks/{network}/subnets/{subnet}. The virtual network must be in the same region and subscription as the Azure Batch Account. The specified subnet should have enough free IP addresses to accommodate the number of Compute Nodes in the Pool. If the subnet doesn''t have enough free IP addresses, the Pool will partially allocate Nodes and a resize error will occur. The ''MicrosoftAzureBatch'' service principal must have the ''Classic Virtual Machine Contributor'' Role-Based Access Control (RBAC) role for the specified VNet. The specified subnet must allow communication from the Azure Batch service to be able to schedule Tasks on the Nodes. This can be verified by checking if the specified VNet has any associated Network Security Groups (NSG). If communication to the Nodes in the specified subnet is denied by an NSG, then the Batch service will set the state of the Compute Nodes to unusable. Only ARM virtual networks (''Microsoft.Network/virtualNetworks'') are supported. If the specified VNet has any associated Network Security Groups (NSG), then a few reserved system ports must be enabled for inbound communication, including ports 29876 and 29877. Also enable outbound connections to Azure Storage on port 443. For more details see: https://learn.microsoft.com/azure/batch/nodes-and-pools#virtual-network-vnet-and-firewall-configuration'
        dynamicVNetAssignmentScope:
          $ref: '#/components/schemas/DynamicVNetAssignmentScope'
          description: The scope of dynamic vnet assignment.
          x-ms-client-name: dynamicVnetAssignmentScope
        endpointConfiguration:
          $ref: '#/components/schemas/BatchPoolEndpointConfigurationUpdate'
          description: The configuration for endpoints on Compute Nodes in the Batch Pool.
        publicIPAddressConfiguration:
          $ref: '#/components/schemas/BatchPublicIpAddressConfiguration'
          description: The Public IPAddress configuration for Compute Nodes in the Batch Pool.
          x-ms-client-name: publicIpAddressConfiguration
        enableAcceleratedNetworking:
          type: boolean
          description: 'Whether this pool should enable accelerated networking. Accelerated networking enables single root I/O virtualization (SR-IOV) to a VM, which may lead to improved networking performance. For more details, see: https://learn.microsoft.com/azure/virtual-network/accelerated-networking-overview.'
    ServiceArtifactReferenceUpdate:
      type: object
      description: 'Specifies the service artifact reference id used to set same image version

        for all virtual machines in the scale set when using ''latest'' image version.'
      properties:
        id:
          type: string
          description: The service artifact reference id of ServiceArtifactReference. The service artifact reference id in the form of /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.Compute/galleries/{galleryName}/serviceArtifacts/{serviceArtifactName}/vmArtifactsProfiles/{vmArtifactsProfilesName}
    BatchJobNetworkConfiguration:
      type: object
      description: (This property is not available by default. Please contact support for more information) The network configuration for the Job.
      properties:
        subnetId:
          type: string
          description: 'The ARM resource identifier of the virtual network subnet which Compute Nodes running Tasks from the Job will join for the duration of the Task. The virtual network must be in the same region and subscription as the Azure Batch Account. The specified subnet should have enough free IP addresses to accommodate the number of Compute Nodes which will run Tasks from the Job. This can be up to the number of Compute Nodes in the Pool. The ''MicrosoftAzureBatch'' service principal must have the ''Classic Virtual Machine Contributor'' Role-Based Access Control (RBAC) role for the specified VNet so that Azure Batch service can schedule Tasks on the Nodes. This can be verified by checking if the specified VNet has any associated Network Security Groups (NSG). If communication to the Nodes in the specified subnet is denied by an NSG, then the Batch service will set the state of the Compute Nodes to unusable. This is of the form /subscriptions/{subscription}/resourceGroups/{group}/providers/{provider}/virtualNetworks/{network}/subnets/{subnet}. If the specified VNet has any associated Network Security Groups (NSG), then a few reserved system ports must be enabled for inbound communication from the Azure Batch service. For Pools created with a Virtual Machine configuration, enable ports 29876 and 29877, as well as port 22 for Linux and port 3389 for Windows. Port 443 is also required to be open for outbound connections for communications to Azure Storage. For more details see: https://learn.microsoft.com/azure/batch/batch-api-basics#virtual-network-vnet-and-firewall-configuration.'
        skipWithdrawFromVNet:
          type: boolean
          description: Whether to withdraw Compute Nodes from the virtual network to DNC when the job is terminated or deleted.  If true, nodes will remain joined to the virtual network to DNC. If false, nodes will automatically withdraw when the job ends. Defaults to false.
          x-ms-client-name: skipWithdrawFromVnet
      required:
