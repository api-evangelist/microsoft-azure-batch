components:
  schemas:
    UpgradePolicy:
      type: object
      description: Describes an upgrade policy - automatic, manual, or rolling.
      properties:
        mode:
          $ref: '#/components/schemas/UpgradeMode'
          title: Specifies the mode of an upgrade to virtual machines in the scale set.<br /><br /> Possible values are:<br /><br /> **Manual** - You  control the application of updates to virtual machines in the scale set. You do this by using the manualUpgrade action.<br /><br /> **Automatic** - All virtual machines in the scale set are automatically updated at the same time.<br /><br /> **Rolling** - Scale set performs updates in batches with an optional pause time in between.
          description: Specifies the mode of an upgrade to virtual machines in the scale set.<br /><br /> Possible values are:<br /><br /> **Manual** - You  control the application of updates to virtual machines in the scale set. You do this by using the manualUpgrade action.<br /><br /> **Automatic** - All virtual machines in the scale set are automatically updated at the same time.<br /><br /> **Rolling** - Scale set performs updates in batches with an optional pause time in between.
        automaticOSUpgradePolicy:
          $ref: '#/components/schemas/AutomaticOSUpgradePolicy'
          title: Configuration parameters used for performing automatic OS Upgrade.
          description: The configuration parameters used for performing automatic OS upgrade.
        rollingUpgradePolicy:
          $ref: '#/components/schemas/RollingUpgradePolicy'
          title: The configuration parameters used while performing a rolling upgrade.
          description: The configuration parameters used while performing a rolling upgrade.
      required:
      - mode
    NodePlacementPolicyType:
      type: string
      description: The default value is regional.
      enum:
      - Regional
      - Zonal
      x-ms-enum:
        name: NodePlacementPolicyType
        modelAsString: false
        values:
        - name: Regional
          value: Regional
          description: All nodes in the pool will be allocated in the same region.
        - name: Zonal
          value: Zonal
          description: Nodes in the pool will be spread across different zones with best effort balancing.
    ManagedDisk:
      type: object
      description: The managed disk parameters.
      properties:
        storageAccountType:
          $ref: '#/components/schemas/StorageAccountType'
          title: The storage account type for use in creating data disks or OS disk.
          description: The storage account type for use in creating data disks or OS disk.
        securityProfile:
          $ref: '#/components/schemas/VMDiskSecurityProfile'
          title: Specifies the security profile for the managed disk.
          description: 'Specifies the security profile settings for the managed disk. **Note**: It can only be set for Confidential VMs and is required when using Confidential VMs.'
        diskEncryptionSet:
          $ref: '#/components/schemas/DiskEncryptionSetParameters'
          description: Specifies the customer managed disk encryption set resource id for the managed disk. It can be set only in UserSubscription mode.
    HostEndpointSettings:
      type: object
      description: Specifies particular host endpoint settings.
      properties:
        mode:
          $ref: '#/components/schemas/HostEndpointSettingsModeTypes'
          description: Specifies the access control policy execution mode.
        inVMAccessControlProfileReferenceId:
          type: string
          format: arm-id
          description: Specifies the reference to the InVMAccessControlProfileVersion resource id in the form of /subscriptions/{SubscriptionId}/resourceGroups/{ResourceGroupName}/providers/Microsoft.Compute/galleries/{galleryName}/inVMAccessControlProfiles/{profile}/versions/{version}.
    UserIdentity:
      type: object
      title: The definition of the user identity under which the task is run.
      description: Specify either the userName or autoUser property, but not both.
      properties:
        userName:
          type: string
          title: The name of the user identity under which the task is run.
          description: The userName and autoUser properties are mutually exclusive; you must specify one but not both.
        autoUser:
          $ref: '#/components/schemas/AutoUserSpecification'
          title: The auto user under which the task is run.
          description: The userName and autoUser properties are mutually exclusive; you must specify one but not both.
    WindowsUserConfiguration:
      type: object
      title: Properties used to create a user account on a Windows node.
      description: Properties used to create a user account on a Windows node.
      properties:
        loginMode:
          $ref: '#/components/schemas/LoginMode'
          title: Login mode for user
          description: Specifies login mode for the user. The default value is Interactive.
    AutoUserScope:
      type: string
      description: The default value is Pool. If the pool is running Windows a value of Task should be specified if stricter isolation between tasks is required. For example, if the task mutates the registry in a way which could impact other tasks.
      enum:
      - Task
      - Pool
      x-ms-enum:
        name: AutoUserScope
        modelAsString: false
        values:
        - name: Task
          value: Task
          description: Specifies that the service should create a new user for the task.
        - name: Pool
          value: Pool
          description: Specifies that the task runs as the common auto user account which is created on every node in a pool.
    TaskSchedulingPolicy:
      type: object
      title: Specifies how tasks should be distributed across compute nodes.
      description: Specifies how tasks should be distributed across compute nodes.
      properties:
        jobDefaultOrder:
          $ref: '#/components/schemas/JobDefaultOrder'
          title: If not specified, the default is none.
          description: The order for scheduling tasks from different jobs with the same priority.
        nodeFillType:
          type: string
          title: How tasks should be distributed across compute nodes.
          description: How tasks should be distributed across compute nodes.
          default: Spread
          enum:
          - Spread
          - Pack
          x-ms-enum:
            name: ComputeNodeFillType
            modelAsString: false
            values:
            - name: Spread
              value: Spread
              description: Tasks should be assigned evenly across all nodes in the pool.
            - name: Pack
              value: Pack
              description: As many tasks as possible (taskSlotsPerNode) should be assigned to each node in the pool before any tasks are assigned to the next node in the pool.
      required:
      - nodeFillType
    PoolIdentityType:
      type: string
      description: The type of identity used for the Batch Pool.
      enum:
      - UserAssigned
      - None
      x-ms-enum:
        name: PoolIdentityType
        modelAsString: false
        values:
        - name: UserAssigned
          value: UserAssigned
          description: Batch pool has user assigned identities with it.
        - name: None
          value: None
          description: Batch pool has no identity associated with it. Setting `None` in update pool will remove existing identities.
    ProxyAgentSettings:
      type: object
      description: Specifies ProxyAgent settings while creating the virtual machine.
      properties:
        enabled:
          type: boolean
          description: Specifies whether Metadata Security Protocol feature should be enabled on the virtual machine or virtual machine scale set. Default is False.
        imds:
          $ref: '#/components/schemas/HostEndpointSettings'
          description: Settings for the IMDS endpoint.
        wireServer:
          $ref: '#/components/schemas/HostEndpointSettings'
          description: Settings for the WireServer endpoint.
    DeploymentConfiguration:
      type: object
      title: Deployment configuration properties.
      description: Deployment configuration properties.
      properties:
        virtualMachineConfiguration:
          $ref: '#/components/schemas/VirtualMachineConfiguration'
          title: The virtual machine configuration for the pool.
          description: The configuration for compute nodes in a pool based on the Azure Virtual Machines infrastructure.
    DiffDiskSettings:
      type: object
      title: Specifies the ephemeral Disk Settings for the operating system disk used by the virtual machine.
      description: Specifies the ephemeral Disk Settings for the operating system disk used by the virtual machine.
      properties:
        placement:
          $ref: '#/components/schemas/DiffDiskPlacement'
          title: Specifies the ephemeral disk placement for operating system disk for all VMs in the pool.
          description: This property can be used by user in the request to choose which location the operating system should be in. e.g., cache disk space for Ephemeral OS disk provisioning. For more information on Ephemeral OS disk size requirements, please refer to Ephemeral OS disk size requirements for Windows VMs at https://learn.microsoft.com/azure/virtual-machines/windows/ephemeral-os-disks#size-requirements and Linux VMs at https://learn.microsoft.com/azure/virtual-machines/linux/ephemeral-os-disks#size-requirements.
