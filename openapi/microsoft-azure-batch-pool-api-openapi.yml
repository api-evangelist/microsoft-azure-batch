        modelAsString: true
        values:
        - name: NonPersistedTPM
          value: NonPersistedTPM
          description: EncryptionType of the managed disk is set to NonPersistedTPM for not persisting firmware state in the VMGuestState blob.
        - name: VMGuestStateOnly
          value: VMGuestStateOnly
          description: EncryptionType of the managed disk is set to VMGuestStateOnly for encryption of just the VMGuestState blob.
