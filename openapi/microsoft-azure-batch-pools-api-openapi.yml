            - name: CreationTime
              value: creationtime
              description: If jobs have equal priority, tasks from jobs that were created earlier should be scheduled first.
        nodeFillType:
          $ref: '#/components/schemas/BatchNodeFillType'
          description: How Tasks are distributed across Compute Nodes in a Pool. If not specified, the default is spread.
