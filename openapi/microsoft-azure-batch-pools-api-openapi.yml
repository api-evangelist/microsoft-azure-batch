        value:
          type: string
          description: The value in the name-value pair.
    NetworkConfigurationUpdate:
      type: object
      description: The network configuration for a Pool.
      properties:
        subnetId:
          type: string
          description: 'The ARM resource identifier of the virtual network subnet which the Compute Nodes of the Pool will join. This is of the form /subscriptions/{subscription}/resourceGroups/{group}/providers/{provider}/virtualNetworks/{network}/subnets/{subnet}. The virtual network must be in the same region and subscription as the Azure Batch Account. The specified subnet should have enough free IP addresses to accommodate the number of Compute Nodes in the Pool. If the subnet doesn''t have enough free IP addresses, the Pool will partially allocate Nodes and a resize error will occur. The ''MicrosoftAzureBatch'' service principal must have the ''Classic Virtual Machine Contributor'' Role-Based Access Control (RBAC) role for the specified VNet. The specified subnet must allow communication from the Azure Batch service to be able to schedule Tasks on the Nodes. This can be verified by checking if the specified VNet has any associated Network Security Groups (NSG). If communication to the Nodes in the specified subnet is denied by an NSG, then the Batch service will set the state of the Compute Nodes to unusable. Only ARM virtual networks (''Microsoft.Network/virtualNetworks'') are supported. If the specified VNet has any associated Network Security Groups (NSG), then a few reserved system ports must be enabled for inbound communication, including ports 29876 and 29877. Also enable outbound connections to Azure Storage on port 443. For more details see: https://learn.microsoft.com/azure/batch/nodes-and-pools#virtual-network-vnet-and-firewall-configuration'
        dynamicVNetAssignmentScope:
          $ref: '#/components/schemas/DynamicVNetAssignmentScope'
          description: The scope of dynamic vnet assignment.
          x-ms-client-name: dynamicVnetAssignmentScope
        endpointConfiguration:
          $ref: '#/components/schemas/BatchPoolEndpointConfigurationUpdate'
          description: The configuration for endpoints on Compute Nodes in the Batch Pool.
        publicIPAddressConfiguration:
          $ref: '#/components/schemas/BatchPublicIpAddressConfiguration'
          description: The Public IPAddress configuration for Compute Nodes in the Batch Pool.
          x-ms-client-name: publicIpAddressConfiguration
        enableAcceleratedNetworking:
          type: boolean
          description: 'Whether this pool should enable accelerated networking. Accelerated networking enables single root I/O virtualization (SR-IOV) to a VM, which may lead to improved networking performance. For more details, see: https://learn.microsoft.com/azure/virtual-network/accelerated-networking-overview.'
    NetworkSecurityGroupRule:
      type: object
      description: A network security group rule to apply to an inbound endpoint.
      properties:
        priority:
          type: integer
          format: int32
          description: The priority for this rule. Priorities within a Pool must be unique and are evaluated in order of priority. The lower the number the higher the priority. For example, rules could be specified with order numbers of 150, 250, and 350. The rule with the order number of 150 takes precedence over the rule that has an order of 250. Allowed priorities are 150 to 4096. If any reserved or duplicate values are provided the request fails with HTTP status code 400.
        access:
          $ref: '#/components/schemas/NetworkSecurityGroupRuleAccess'
          description: The action that should be taken for a specified IP address, subnet range or tag.
        sourceAddressPrefix:
          type: string
          description: The source address prefix or tag to match for the rule. Valid values are a single IP address (i.e. 10.10.10.10), IP subnet (i.e. 192.168.1.0/24), default tag, or * (for all addresses).  If any other values are provided the request fails with HTTP status code 400.
        sourcePortRanges:
          type: array
          description: The source port ranges to match for the rule. Valid values are '*' (for all ports 0 - 65535), a specific port (i.e. 22), or a port range (i.e. 100-200). The ports must be in the range of 0 to 65535. Each entry in this collection must not overlap any other entry (either a range or an individual port). If any other values are provided the request fails with HTTP status code 400. The default value is '*'.
          items:
            type: string
      required:
      - priority
      - access
      - sourceAddressPrefix
