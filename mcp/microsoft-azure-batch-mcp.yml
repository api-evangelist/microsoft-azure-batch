finding: Microsoft ships a first-party MCP server for Azure — the Azure MCP Server, github.com/microsoft/mcp,
  distributed as @azure/mcp on npm (3.0.0-beta.44, published 2026-09-15), plus NuGet and PyPI builds,
  all declared transport stdio in its server.json. It has NO Azure Batch tool area. Its tools/ directory
  carries 60+ Azure.Mcp.Tools.* projects (Aks, AppService, Cosmos, Storage, KeyVault, Kusto, Monitor,
  Postgres, ServiceBus, Sql, …) and none of them is Batch, checked 2026-09-17. So there is no MCP server
  — hosted or local — through which an agent can create a Batch pool, submit a job, or list tasks. No
  MCPServer pointer is claimed for this provider; the tool list below is a DERIVED candidate showing what
  such a server would expose if Microsoft built one.
related_microsoft_mcp_servers:
- name: Azure MCP Server
  repo: https://github.com/microsoft/mcp
  package: https://www.npmjs.com/package/@azure/mcp
  version: 3.0.0-beta.44
  published: '2026-09-15'
  mode: local-stdio
  covers_batch: false
  note: Generic Azure coverage. A Batch operator could reach Batch only through its az-CLI passthrough
    tool, not through typed Batch tools.
auth_note: 'A real Batch MCP server would carry the same auth as the REST contract: Microsoft Entra ID
  OAuth 2.0, scope https://batch.core.windows.net//.default, with effective permission decided by Azure
  RBAC role assignment on the Batch account.'
