source: https://azure.microsoft.com/en-us/pricing/details/batch/
tags:
  - Consumption
  - Pay As You Go
description: >-
  Azure Batch publishes NO plan tiers. Microsoft's own technical overview states it
  plainly: "There's no extra charge to use Batch. You pay only for the underlying
  resources consumed, such as virtual machines, storage, and networking." The Batch
  control surface — accounts, jobs, pools, tasks, job schedules — is free; billing
  happens against the compute, storage and network the pools consume, at ordinary
  Azure VM rates, with Spot (low-priority) VMs as the discount lever. REPLACES a
  2026-05-04 scaffold that invented Free / Professional / Enterprise tiers with
  invented request quotas and prices; none of those exist.
plan_count: 0
plans: []
pricing_model:
  type: consumption
  billable_units:
    - unit: virtual machine compute
      description: >-
        Pool compute nodes are billed at the standard Azure Virtual Machines rate for
        the VM size and region chosen, for as long as the node exists — not per task.
      source: https://azure.microsoft.com/en-us/pricing/details/batch/
    - unit: storage
      description: Auto-storage account, application packages, and task output storage bill at Azure Storage rates.
    - unit: networking
      description: Egress and any networking resources the pool uses bill at standard Azure rates.
  discounts:
    - name: Spot / low-priority VMs
      description: >-
        Batch pools can be allocated on Spot (low-priority) VMs at reduced rates, with
        the trade-off that nodes can be preempted. Suitable only for interruption-tolerant
        workloads.
      source: https://azure.microsoft.com/en-us/pricing/details/batch/
    - name: Reserved Instances
      description: >-
        Microsoft's own pricing FAQ: RIs apply only to Batch accounts in USER SUBSCRIPTION
        pool allocation mode, where the VMs are deployed into the customer's subscription.
        Batch service mode accounts cannot use RIs.
      source: https://azure.microsoft.com/en-us/pricing/details/batch/
trial:
  available: true
  description: >-
    Azure's platform-wide free account — USD 200 credit for 30 days plus a set of always-free
    services. There is no Batch-specific free tier, sandbox, or test mode.
  url: https://azure.microsoft.com/en-us/free/
  note: >-
    Batch itself carries no charge; the credit is consumed by the VMs the Batch pools allocate.
notes:
  - >-
    Quotas, not prices, are what actually gate a Batch account at low spend — see
    rate-limits/microsoft-azure-batch-rate-limits.yml. A new account can have a default
    dedicated-core quota as low as zero in some regions.
  - >-
    The pricing page renders its rate tables client-side; the structural claims above are
    read from the page's own static copy and from Microsoft's Batch technical overview
    (https://learn.microsoft.com/en-us/azure/batch/batch-technical-overview).
