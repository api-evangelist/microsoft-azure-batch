format: azure-batch-error-envelope
note: 'Azure Batch does NOT use RFC 9457 application/problem+json. It returns a Microsoft Azure error
  envelope: a string `code`, a localized `message` object {lang, value}, and an optional `values[]` array
  of {key, value} pairs naming the offending parameter and the reason. The published registry below is
  the provider''s own, transcribed verbatim from the Batch Status and Error Codes reference on 2026-09-17.'
envelope:
  media_type: application/json
  fields:
  - field: code
    type: string
    description: Machine-readable error code; the values enumerated below.
  - field: message
    type: object
    description: 'Localized human message: {lang, value}.'
  - field: values
    type: array
    description: Optional {key, value} pairs — e.g. QueryParameterName, QueryParameterValue, Reason.
  example:
    code: InvalidQueryParameterValue
    message:
      lang: en-us
      value: Value for one of the query parameters specified in the request URI is invalid
    values:
    - key: QueryParameterName
      value: state
    - key: QueryParameterValue
      value: deleted
    - key: Reason
      value: invalid state
  source: https://learn.microsoft.com/en-us/rest/api/batchservice/batch-status-and-error-codes
